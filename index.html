<style>
:root { --bg: #000000; --surface: #111015; --text: #F4F2FA; --muted: #A9A3BB; --line: #26232F;
        --violet: #7C4DFF; --violet-light: #B89EFF; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: "Inter", system-ui, sans-serif;
       font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 40px; }
.brand { font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none; }
.brand span { color: var(--violet); }
.lang { color: var(--violet-light); text-decoration: none; font-size: 14px; border: 1px solid var(--line);

.updated { color: var(--muted); font-size: 14px; margin: 0 0 32px; }
h2 { font-size: 19px; margin: 36px 0 8px; }
p, li { color: var(--muted); }
ul, ol { padding-left: 22px; }
li { margin: 4px 0; }
a { color: var(--violet-light); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 8px 20px; margin: 16px 0; }
.card dt { color: var(--text); font-weight: 600; margin-top: 12px; }
.card dd { margin: 2px 0 12px; color: var(--muted); }
.warning { border-left: 3px solid var(--violet); padding: 4px 0 4px 16px; margin: 16px 0; }
.warning strong { color: var(--text); display: block; }
footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
footer nav { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 8px; }
